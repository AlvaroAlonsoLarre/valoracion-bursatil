
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker Yahoo, p.ej. MSFT o 000660.KS"
        required: true
        default: MSFT
        type: string
      trimestres:
        description: "Número de trimestres (4-24)"
        required: true
        default: "12"
        type: string
      publicar_resumen:
        description: "Guardar resumen JSON en GitHub"
        required: true
        type: boolean
        default: false

  push:
    branches: [main]
    paths-ignore:
      - 'Resultados_publicados/**'

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'Resultados_publicados/**'

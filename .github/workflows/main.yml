name: Valoración bursátil V5 (Yahoo + SEC)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker Yahoo, p.ej. MSFT o 000660.KS"
        required: true
        default: MSFT
        type: string
      trimestres:
        description: "Número de trimestres (4-24)"
        required: true
        default: "12"
        type: string
      publicar_resumen:
        description: "Guardar JSON resumido en el repositorio (SIN Excel), para leerlo desde ChatGPT-GitHub"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  valorar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas sin conexión
        run: |
          python autoprueba_modelo.py
          python prueba_comparables_automaticos.py
          python test_v5.py
      - name: Ejecutar análisis desde Internet
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          ANALYSIS_TICKER: ${{ inputs.ticker }}
          ANALYSIS_QUARTERS: ${{ inputs.trimestres }}
        run: |
          python ejecutar_analisis.py --ticker "$ANALYSIS_TICKER" --num-quarters "$ANALYSIS_QUARTERS" --outdir Resultados
      - name: Conservar Excel, resumen y registro incluso en error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoracion-v5-${{ github.run_number }}
          path: Resultados/
          if-no-files-found: warn
          retention-days: 30

  publicar-resumen:
    if: ${{ inputs.publicar_resumen == true }}
    needs: valorar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: valoracion-v5-${{ github.run_number }}
          path: Resultados/
      - name: Publicar solo JSON (sin credenciales ni Excel)
        env:
          ANALYSIS_TICKER: ${{ inputs.ticker }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p Resultados_publicados
          cp "Resultados/${ANALYSIS_TICKER}_resumen.json" "Resultados_publicados/${ANALYSIS_TICKER}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Resultados_publicados/${ANALYSIS_TICKER}.json"
          if ! git diff --staged --quiet; then
            git commit -m "Actualiza auditoría ${ANALYSIS_TICKER}"
            git push origin "HEAD:$REF_NAME"
          fi

name: V6 · pruebas rápidas y matriz financiera manual

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Vacío ejecuta la muestra de 13 tickers; otro ticker ejecuta sólo ese emisor'
        required: false
        default: ''
        type: string
      trimestres:
        description: 'Trimestres solicitados (4-24)'
        default: '12'
        type: string
  schedule:
    - cron: '20 6 * * 6'
  push:
    branches: [main]
    paths-ignore: ['Resultados_publicados/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore: ['Resultados_publicados/**']

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tickers: ${{ steps.matrix.outputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Pruebas unitarias y de integración offline
        run: |
          python -m pytest -q tests
          python autoprueba_modelo.py
          python prueba_comparables_automaticos.py
          python test_v5.py
      - id: matrix
        name: Matriz explícita de cobertura (con entrada multiempresa opcional)
        env:
          MANUAL_TICKER: ${{ inputs.ticker }}
        run: |
          python - <<'PY'
          import json, os, re
          ticker=os.environ.get('MANUAL_TICKER','').strip().upper()
          if ticker and not re.fullmatch(r'[A-Z0-9][A-Z0-9.\-^=]{0,24}',ticker):
              raise ValueError('Ticker no válido')
          tickers=[ticker] if ticker else ['MSFT','NVDA','AMZN','NFLX','META','GOOGL','GOOG','MU','SNDK','SPCX','JNJ','JPM','000660.KS']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('tickers='+json.dumps(tickers)+'\n')
          PY

  valorar:
    needs: pruebas
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        ticker: ${{ fromJSON(needs.pruebas.outputs.tickers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Ejecutar análisis con red
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          ANALYSIS_TICKER: ${{ matrix.ticker }}
          ANALYSIS_QUARTERS: ${{ inputs.trimestres || '12' }}
        run: |
          set +e
          python ejecutar_analisis.py --ticker "$ANALYSIS_TICKER" --num-quarters "$ANALYSIS_QUARTERS" --outdir Resultados 2>&1 | tee consola.log
          status=${PIPESTATUS[0]}
          mkdir -p Resultados
          mv consola.log Resultados/
          # 2 = insuficiencia financiera documentada; 1 = error técnico.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
      - name: Conservar diagnóstico incluso si se bloquea la valoración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoracion-${{ matrix.ticker }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: Resultados/
          if-no-files-found: error
          retention-days: 30

  cobertura:
    needs: [pruebas, valorar]
    if: ${{ always() && needs.pruebas.result == 'success' && needs.valorar.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: valoracion-*
          path: Resultados
      - name: Comprobar cobertura y procedencia de la muestra
        env:
          TICKERS_JSON: ${{ needs.pruebas.outputs.tickers }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from cobertura import build_manifest
          result=build_manifest('Resultados',json.loads(os.environ['TICKERS_JSON']),os.environ['EXPECTED_SHA'])
          Path('cobertura.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['complete']:raise SystemExit(2)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cobertura.json
          if-no-files-found: error
